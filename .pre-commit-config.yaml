# Pre-commit hooks for the Abnuel Data Engineering track.
# These run automatically on `git commit` (and therefore before any push),
# and again in CI (.github/workflows/checks.yml) as a backstop.
#
# One-time setup:   pip install pre-commit  &&  pre-commit install
# Also gate pushes: pre-commit install --hook-type pre-push   (optional)
# Run on demand:    pre-commit run --all-files
# Refresh pins:     pre-commit autoupdate
#
# Public repos: the secret-scanning hooks below matter — never commit a key.

minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]
default_language_version:
  python: python3.12

repos:
  # ---------------------------------------------------------------- file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  # ---------------------------------------------------------------- Python (ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff            # lint (with autofix)
        args: [--fix]
      - id: ruff-format     # format

  # ---------------------------------------------------------------- SQL (sqlfluff)
  # BigQuery dialect, dbt-aware via the jinja templater + dbt builtins
  # (no dbt profile/credentials needed — see .sqlfluff).
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.3.0
    hooks:
      - id: sqlfluff-lint

  # ---------------------------------------------------------------- YAML style
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # ---------------------------------------------------------------- Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml, --fix]

  # ---------------------------------------------------------------- Terraform fmt
  # Runs only when .tf files change; needs the terraform binary (CI installs it).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.3
    hooks:
      - id: terraform_fmt

  # ---------------------------------------------------------------- secret scan
  # Portfolios and pod repos are PUBLIC — block secrets before they ever land.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
