# markdownlint — relaxed for technical documentation.
default: true
MD013: false          # line length — off (long links, tables, code)
MD033: false          # inline HTML — allowed (badges, <details>, <br>)
MD041: false          # first line need not be a top-level heading (badges first)
MD024:
  siblings_only: true # allow repeated headings under different parents
MD029:
  style: ordered      # ordered lists numbered 1. 2. 3.
MD060: false          # table pipe spacing — off (compact |---| separators are fine)
